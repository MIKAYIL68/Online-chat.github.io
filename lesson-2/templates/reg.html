<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <form action="/send" method="post" class="reg-form">
        <h2>Регистрация</h2>
        Логин: <input name="login" class="input-field" required minlength="3"><br>
        Пароль: <input type="password" name="password" class="input-field" required minlength="8"><br>
        Номер телефона: <input name="phone" class="input-field"><br>
        Электронная почта: <input type="email" name="Gmail" class="input-field" required><br>
        <button type="submit" class="submit-btn">Зарегистрироваться</button>
        <br><a href="/login">Уже есть аккаунт? Войти</a>
    </form>
</body>
</html>
