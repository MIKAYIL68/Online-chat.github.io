<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="/static/main.css">
    <style>
        .main-card {
            max-width: 420px;
            margin: 100px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.10);
            padding: 48px 40px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-card h2 {
            font-size: 1.7rem;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .main-card p {
            color: #666;
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }
        .btn-profile, .button1 {
            display: inline-block;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            box-sizing: border-box;
            flex: 1;
            max-width: 160px;
            text-align: center;
        }
        .btn-profile:hover, .button1:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>👋 Привет, {{ login }}!</h2>
        <p>Ты успешно вошёл в аккаунт.</p>
        
        <div class="buttons-container">
            <a href="/profile" class="btn-profile">👤 Профиль</a>
            <!-- Проверь, чтобы id был в точности button1 -->
            <button id="button1" class="button1">Перейди на страницу чата</button>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ СКРИПТ (БРАУЗЕР НЕ СМОЖЕТ ЕГО СКОПИРОВАТЬ ИЗ КЭША) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const exitButton = document.getElementById('button1');
            
            if (exitButton) {
                exitButton.addEventListener('click', () => {
                    // Перенаправление на роут FastAPI
                    window.location.href = '/chat_page'; 
                });
            }
        });
    </script>

</body>
</html>
